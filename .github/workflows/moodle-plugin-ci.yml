name: Moodle Plugin CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      mariadb:
        image: mariadb:10.11.7
        env:
          MYSQL_ROOT_PASSWORD: ''
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
          MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
          MYSQL_COLLATION_SERVER: "utf8mb4_unicode_ci"
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping --silent" --health-interval=10s --health-timeout=5s --health-retries=3

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
        moodle-branch: ['MOODLE_500_STABLE']
        database: [mariadb]

    steps:
      # The repository is named "moodle-enrol_<slug>" by convention; the plugin
      # directory itself (and everything moodle-plugin-ci expects) is just
      # "<slug>", so derive it here instead of hardcoding it - this keeps the
      # workflow correct across forks/renames without any manual edits.
      - name: Determine plugin slug
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          echo "PLUGIN_SLUG=${REPO_NAME#moodle-enrol_}" >> "$GITHUB_ENV"

      - name: Checkout Plugin
        uses: actions/checkout@v4
        with:
          path: ${{ env.PLUGIN_SLUG }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, soap, curl, gd, xml, json, zip, pdo, pdo_mysql,
          ini-values: max_input_vars=5000
          coverage: none

      - name: Setup Node.js (for Grunt)
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # moodle-plugin-ci's Mustache Lint step shells out to a Java-based HTML
      # validator (vnu.jar) to check each template's rendered output. Without
      # an explicit setup, whether a working `java` ends up on PATH depends on
      # undocumented runner-image defaults - set up a known-good JDK instead
      # of relying on that.
      - name: Setup Java (for Mustache Lint's HTML validator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Moodle Node dependencies
        run: npm install
        working-directory: ${{ env.PLUGIN_SLUG }}

      - name: Build grunt
        run: npm run build
        working-directory: ${{ env.PLUGIN_SLUG }}

      - name: Install Plugin Composer Dependencies
        run: composer install --no-dev --prefer-dist --no-progress
        working-directory: ${{ env.PLUGIN_SLUG }}

      - name: Clean Extra Files from Plugin
        run: |
          rm -rf "$PLUGIN_SLUG/.git" "$PLUGIN_SLUG/.github" "$PLUGIN_SLUG/node_modules" "$PLUGIN_SLUG/tests" "$PLUGIN_SLUG/phpunit.xml" "$PLUGIN_SLUG/vendor"
          rm -f "$PLUGIN_SLUG"/composer.* "$PLUGIN_SLUG"/package*.json "$PLUGIN_SLUG/webpack.config.js" "$PLUGIN_SLUG/.zipignore"

      - name: Install moodle-plugin-ci tooling
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(cd ci/bin; pwd)" >> $GITHUB_PATH
          echo "$(cd ci/vendor/bin; pwd)" >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
        env:
          COMPOSER_NO_INTERACTION: 1

      - name: Install moodle-plugin-ci
        run: moodle-plugin-ci install --plugin "./$PLUGIN_SLUG" --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint "$PLUGIN_SLUG"

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0 "$PLUGIN_SLUG"

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0 "$PLUGIN_SLUG"

      - name: PHP Mess Detector
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: moodle-plugin-ci phpmd "$PLUGIN_SLUG"


      - name: Mustache Lint
        if: ${{ !cancelled() }}
        # No explicit plugin path here (unlike the other steps): mustache lint
        # renders templates through Moodle's own component/HTML-validator
        # machinery, which requires the plugin's actual in-Moodle-tree
        # location, not this checkout's original path. moodle-plugin-ci's
        # `install` step already recorded that correct path in PLUGIN_DIR
        # (loaded automatically from ci/.env on every invocation), so passing
        # our own path here would override it with the wrong one.
        run: moodle-plugin-ci mustache

      - name: PHP Code Beautifier and Fixer
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcbf "$PLUGIN_SLUG"

      - name: Validate Plugin
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate "$PLUGIN_SLUG"

      - name: Check Upgrade Savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints "$PLUGIN_SLUG"

      - name: PHPUnit Tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning "$PLUGIN_SLUG"

      - name: Run Behat Tests
        id: behat
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci behat --profile chrome --scss-deprecations "$PLUGIN_SLUG"


      - name: Upload Behat Faildump (if failed)
        if: ${{ failure() && steps.behat.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: Behat Faildump (${{ matrix.php }}, ${{ matrix.database }})
          path: ${{ github.workspace }}/moodledata/behat_dump
          retention-days: 7
          if-no-files-found: ignore

      - name: Final Cleanup - Remove Vendor
        if: ${{ always() }}
        run: rm -rf "$PLUGIN_SLUG/vendor"

      - name: Mark cancelled jobs as failed
        if: ${{ cancelled() }}
        run: exit 1

  create_tag_and_release:
    runs-on: ubuntu-24.04
    needs: test
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'Merge pull request')
    permissions:
      contents: write
    steps:
      - name: Determine plugin slug
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          echo "PLUGIN_SLUG=${REPO_NAME#moodle-enrol_}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          path: ${{ env.PLUGIN_SLUG }}

      - uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Clear npm cache
        run: npm cache clean --force

      - name: Install Moodle Node dependencies
        run: npm install
        working-directory: ${{ env.PLUGIN_SLUG }}

      - name: Install Composer Dependencies
        run: composer install --no-dev --prefer-dist --no-progress
        working-directory: ${{ env.PLUGIN_SLUG }}

      - name: Prepare Release Folder
        run: mkdir -p release

      - name: Build Zip using exclude.lst
        run: |
          zip -r "release/$PLUGIN_SLUG.zip" "$PLUGIN_SLUG" -x@"$PLUGIN_SLUG/exclude.lst"

      - name: Get version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
        working-directory: ${{ env.PLUGIN_SLUG }}

      - name: Determine release date
        id: reldate
        run: |
          DAY=$(date -u +%-d)
          case $DAY in
            1|21|31) SUFFIX="st" ;;
            2|22) SUFFIX="nd" ;;
            3|23) SUFFIX="rd" ;;
            *) SUFFIX="th" ;;
          esac
          echo "date=${DAY}${SUFFIX} $(date -u +'%B %Y')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: release/${{ env.PLUGIN_SLUG }}.zip
          body: |
            We're pleased to announce the official release of Stripe Payment Gateway for Moodle v${{ steps.version.outputs.version }}.

            Thank you for using our Stripe Payment plugin and for being part of the Moodle community.

            Release Information

            Version: v${{ steps.version.outputs.version }}
            Release: Official
            Date: ${{ steps.reldate.outputs.date }}

            Thank you for choosing our plugin. We appreciate your continued support!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
